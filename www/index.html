<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071326">
<title>Craque do Traço V8 — Protótipo 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101d;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:white;touch-action:none}
#game{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand,.pill{background:#08182ddd;border:1px solid #ffffff22;border-radius:14px;padding:9px 12px;box-shadow:0 6px 22px #0005}.brand{font-weight:900;letter-spacing:.3px}.brand b{color:#ffcf31}.pill{font-weight:800;font-size:13px}
.hint{align-self:center;text-align:center;background:#061426d9;border:1px solid #ffffff24;border-radius:15px;padding:9px 13px;font-size:13px;max-width:92%;text-shadow:0 2px 4px #000}
.bottom{display:flex;align-items:end;justify-content:space-between;gap:10px}.controls{display:flex;gap:9px;align-items:end}.btn{pointer-events:auto;border:1px solid #ffffff40;color:#fff;background:#0b2344dd;border-radius:16px;padding:13px 15px;font-weight:900;box-shadow:0 6px 18px #0005}.btn.primary{background:#ffca28;color:#102039;border:0}.btn:active{transform:scale(.97)}#joystick{pointer-events:auto;width:106px;height:106px;border-radius:50%;border:2px solid #ffffff66;background:#07182c99;position:relative;touch-action:none}#stick{position:absolute;width:42px;height:42px;left:30px;top:30px;border-radius:50%;background:#ffffffd9;box-shadow:0 2px 8px #0008}
#status{position:absolute;left:50%;top:21%;transform:translateX(-50%);font-size:clamp(24px,6vw,42px);font-weight:1000;color:#ffda42;text-shadow:0 4px 12px #000;opacity:0;transition:opacity .25s;pointer-events:none}
#drawHelp{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);font-size:12px;color:#fff;background:#061426b8;padding:7px 10px;border-radius:10px;pointer-events:none}
@media(min-width:700px){.hud{padding:18px 22px}.btn{padding:13px 18px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="status">GOOOL!</div>
<div class="hud">
 <div class="top"><div class="brand">👑 CRAQUE <b>DO TRAÇO</b></div><div class="pill">V8 • PROTÓTIPO 3D</div><div class="pill" id="phase">FASE 1 ⭐ 0</div></div>
 <div class="hint" id="hint">Use o controle para andar. Com a bola perto, desenhe o caminho do passe ou chute.</div>
 <div class="bottom">
  <div id="joystick"><div id="stick"></div></div>
  <div class="controls"><button class="btn" id="reset">REINICIAR</button><button class="btn primary" id="draw">✏️ DESENHAR CHUTE</button></div>
 </div>
</div>
<div id="drawHelp">Toque em “Desenhar chute” e arraste até o alvo</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const mount=document.getElementById('game');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x78b8ed); scene.fog=new THREE.Fog(0x78b8ed,36,90);
const camera=new THREE.PerspectiveCamera(47,innerWidth/innerHeight,.1,180);
camera.position.set(0,13,23); camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8eeff,0x26431e,2.0));
const sun=new THREE.DirectionalLight(0xffffff,3.0);sun.position.set(-8,18,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness});
const green1=mat(0x218a3e),green2=mat(0x2a9948),white=mat(0xffffff),dark=mat(0x101827),blue=mat(0x0878ee),red=mat(0xf04444),skin=mat(0xe8b18b),black=mat(0x171a22),gold=mat(0xffcf29),netmat=new THREE.MeshStandardMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.48});
const field=new THREE.Group();scene.add(field);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(34,48),green1);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.position.z=-3;field.add(ground);
for(let i=0;i<12;i++){const stripe=new THREE.Mesh(new THREE.PlaneGeometry(34,4),i%2?green1:green2);stripe.rotation.x=-Math.PI/2;stripe.position.set(0,.008,-25+i*4);stripe.receiveShadow=true;field.add(stripe)}
function line(points,color=0xffffff,opacity=1){const geo=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p)));const m=new THREE.LineBasicMaterial({color,transparent:opacity<1,opacity});const l=new THREE.Line(geo,m);scene.add(l);return l}
line([[-16,.03,20],[16,.03,20],[16,.03,-26],[-16,.03,-26],[-16,.03,20]]);
line([[-16,.035,8],[16,.035,8]]);line([[-16,.035,-10],[16,.035,-10]]);
const circlePts=[];for(let i=0;i<=64;i++){const a=i/64*Math.PI*2;circlePts.push([Math.cos(a)*4,.04,Math.sin(a)*4-1])}line(circlePts);
line([[-7,.04,-26],[7,.04,-26],[7,.04,-19],[-7,.04,-19],[-7,.04,-26]]);
// Goal at far end
const goal=new THREE.Group();scene.add(goal);goal.position.set(0,0,-25.5);
function bar(a,b,r=.12){const d=new THREE.Vector3(...b).sub(new THREE.Vector3(...a));const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),10),white);mesh.position.copy(new THREE.Vector3(...a).add(new THREE.Vector3(...b)).multiplyScalar(.5));mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());mesh.castShadow=true;goal.add(mesh)}
bar([-5,0,0],[-5,3.1,0]);bar([5,0,0],[5,3.1,0]);bar([-5,3.1,0],[5,3.1,0]);
const net=new THREE.Mesh(new THREE.BoxGeometry(10,3.1,2),netmat);net.position.set(0,1.5,-.8);goal.add(net);
// simple grandstands and tiny crowd
for(const side of [-1,1]){const stand=new THREE.Mesh(new THREE.BoxGeometry(6,4,43),mat(0x263957));stand.position.set(side*19,2,-3);stand.castShadow=true;scene.add(stand);for(let row=0;row<4;row++)for(let col=0;col<15;col++){const colors=[0xffcc55,0xffffff,0x3ea3ff,0xff5555,0x80dd9a];const person=new THREE.Mesh(new THREE.SphereGeometry(.18,7,6),mat(colors[(row*7+col*3)%colors.length]));person.position.set(side*19+(Math.random()-.5)*4,4.15+row*.35,-23+col*2.6);scene.add(person)}}
function makePlayer(color,x,z,number){const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);g.userData={homeX:x,homeZ:z};const shirt=mat(color),shorts=mat(color===0x0878ee?0x073e9b:color===0xf04444?0x8c1927:0x161d29);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.7,4,8),shirt);torso.position.y=1.55;torso.castShadow=true;g.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.37,12,10),skin);head.position.y=2.35;head.castShadow=true;g.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.38,10,8,0,Math.PI*2,0,Math.PI*.55),black);hair.position.set(0,2.48,0);g.add(hair);const legmat=shorts;for(const side of [-1,1]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.48,3,6),legmat);leg.position.set(side*.22,.68,0);leg.castShadow=true;g.add(leg);const boot=new THREE.Mesh(new THREE.BoxGeometry(.22,.13,.42),dark);boot.position.set(side*.22,.18,-.08);g.add(boot);const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.48,3,6),shirt);arm.position.set(side*.56,1.57,0);arm.rotation.z=side*-.22;g.add(arm)}const num=new THREE.Mesh(new THREE.PlaneGeometry(.42,.45),white);num.position.set(0,1.6,.49);num.material=mat(0xffffff);num.material.side=THREE.DoubleSide;g.add(num);return g}
const hero=makePlayer(0x101827,0,12,10);const teammate1=makePlayer(0x0878ee,-5,3,7);const teammate2=makePlayer(0x0878ee,5,2,11);const opponent1=makePlayer(0xf04444,-4,-5,2);const opponent2=makePlayer(0xf04444,4,-9,5);const keeper=makePlayer(0x159447,0,-22,1);keeper.scale.set(.9,.9,.9);
function makeBall(){const b=new THREE.Mesh(new THREE.SphereGeometry(.38,24,18),white);b.castShadow=true;b.position.set(0,.4,10.7);scene.add(b);const seams=new THREE.Group();for(let i=0;i<3;i++){const curve=new THREE.Mesh(new THREE.TorusGeometry(.25,.018,5,28),dark);curve.rotation.set(i*.9,i*1.2,i*.7);seams.add(curve)}b.add(seams);return b}
let ball=makeBall(),vel=new THREE.Vector3(),moving=false,drawMode=false,won=false,phase=1,stars=0;let pathLine=null,drawPoints=[];const phaseEl=document.getElementById('phase'),hint=document.getElementById('hint'),status=document.getElementById('status');
function updateHud(){phaseEl.textContent=`FASE ${phase} ⭐ ${stars}`}
function reset(){ball.position.set(hero.position.x,.4,hero.position.z-1.25);vel.set(0,0,0);moving=false;won=false;status.style.opacity=0;keeper.position.set(0,0,-22);if(pathLine){scene.remove(pathLine);pathLine=null}drawPoints=[];drawMode=false;document.getElementById('draw').textContent='✏️ DESENHAR CHUTE';hint.textContent='Use o controle para andar. Com a bola perto, desenhe o caminho do passe ou chute.'}
function screenToGround(ev){const r=renderer.domElement.getBoundingClientRect();const ndc=new THREE.Vector2((ev.clientX-r.left)/r.width*2-1,-((ev.clientY-r.top)/r.height*2-1));const ray=new THREE.Raycaster();ray.setFromCamera(ndc,camera);const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);const p=new THREE.Vector3();ray.ray.intersectPlane(plane,p);return p}
document.getElementById('draw').addEventListener('click',()=>{drawMode=!drawMode;document.getElementById('draw').textContent=drawMode?'TOQUE E ARRASTE NO CAMPO':'✏️ DESENHAR CHUTE';hint.textContent=drawMode?'Arraste do ponto da bola até o alvo.':'Use o controle para andar e desenhe a trajetória para chutar.'});
renderer.domElement.addEventListener('pointerdown',e=>{if(!drawMode||won)return;const p=screenToGround(e);drawPoints=[new THREE.Vector3(ball.position.x,.12,ball.position.z),new THREE.Vector3(p.x,.12,p.z)];if(pathLine)scene.remove(pathLine);pathLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(drawPoints),new THREE.LineBasicMaterial({color:0xffd329,linewidth:4}));scene.add(pathLine);renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drawMode||!drawPoints.length)return;const p=screenToGround(e);drawPoints.push(new THREE.Vector3(p.x,.12,p.z));if(pathLine)scene.remove(pathLine);pathLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(drawPoints),new THREE.LineBasicMaterial({color:0xffd329}));scene.add(pathLine)});
renderer.domElement.addEventListener('pointerup',()=>{if(!drawMode||drawPoints.length<2)return;const first=drawPoints[0],last=drawPoints[drawPoints.length-1];const dx=last.x-ball.position.x,dz=last.z-ball.position.z;const len=Math.max(1,Math.hypot(dx,dz));vel.set(dx/len* Math.min(19,7+len*.75),3.0,dz/len*Math.min(19,7+len*.75));moving=true;drawMode=false;drawPoints=[];document.getElementById('draw').textContent='✏️ DESENHAR CHUTE';hint.textContent='Acompanhe a jogada! O goleiro vai tentar defender.'});
let joy={x:0,z:0},joyActive=false;const joyEl=document.getElementById('joystick'),stick=document.getElementById('stick');
function joyStart(e){joyActive=true;joyMove(e);joyEl.setPointerCapture(e.pointerId)}function joyMove(e){if(!joyActive)return;const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),max=32;if(l>max){dx=dx/l*max;dy=dy/l*max}stick.style.transform=`translate(${dx}px,${dy}px)`;joy.x=dx/max;joy.z=dy/max}function joyEnd(){joyActive=false;joy.x=0;joy.z=0;stick.style.transform='translate(0,0)'}joyEl.addEventListener('pointerdown',joyStart);joyEl.addEventListener('pointermove',joyMove);joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
document.getElementById('reset').addEventListener('click',reset);
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.035);if(!moving&&!drawMode&&!won){hero.position.x=THREE.MathUtils.clamp(hero.position.x+joy.x*dt*6,-14,14);hero.position.z=THREE.MathUtils.clamp(hero.position.z+joy.z*dt*6,-24,19);if(ball.position.distanceTo(new THREE.Vector3(hero.position.x,ball.position.y,hero.position.z-1))<1.8){ball.position.x=THREE.MathUtils.lerp(ball.position.x,hero.position.x,dt*4);ball.position.z=THREE.MathUtils.lerp(ball.position.z,hero.position.z-1,dt*4)}}if(moving){ball.position.addScaledVector(vel,dt);vel.y-=9.8*dt;if(ball.position.y<.38){ball.position.y=.38;vel.y=Math.abs(vel.y)*.48;if(Math.abs(vel.y)<1.1)vel.y=0}ball.rotation.x+=vel.z*dt;ball.rotation.z-=vel.x*dt;
keeper.position.x=THREE.MathUtils.clamp(keeper.position.x+(ball.position.x-keeper.position.x)*dt*1.5,-4.2,4.2);
if(ball.position.z<-24.7&&Math.abs(ball.position.x)<5.1&&ball.position.y<3.2){moving=false;won=true;stars=Math.min(300,stars+3);status.textContent='GOOOL! ⚽';status.style.opacity=1;hint.textContent='Gol! Protótipo de jogabilidade 3D.';updateHud();setTimeout(()=>{status.style.opacity=0},1800)}else if(Math.abs(ball.position.x)>16||ball.position.z>22||ball.position.z<-29){moving=false;hint.textContent='A bola saiu. Toque em reiniciar para tentar de novo.'}if(Math.abs(ball.position.x-keeper.position.x)<.8&&ball.position.z<-21&&ball.position.y<2.7){moving=false;hint.textContent='Defesa do goleiro! Tente outro chute.'}}
const target=new THREE.Vector3(hero.position.x*.24,0,hero.position.z*.22);camera.position.x=THREE.MathUtils.lerp(camera.position.x,hero.position.x*.25,dt*1.2);camera.position.z=THREE.MathUtils.lerp(camera.position.z,23+hero.position.z*.08,dt);camera.lookAt(target.x,0,target.z-5);renderer.render(scene,camera)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);updateHud();reset();animate();
</script>
</body>
</html>
