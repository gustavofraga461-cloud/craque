name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap add android
      - name: Gerar icone
        if: hashFiles('assets/icon-only.png') != ''
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0d4a24' --iconBackgroundColorDark '#0d4a24'
      - run: npx cap sync android
      - name: Corrigir Kotlin duplicado
        run: |
          cat >> android/app/build.gradle <<'FIM'
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          FIM
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: craque-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
