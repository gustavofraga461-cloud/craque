<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Craque do Traço</title>
<style>
:root{--bg:#f2f5f0;--fg:#1b2a1b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a10;--fg:#e8f2e6}}
:root[data-theme="dark"]{--bg:#0f1a10;--fg:#e8f2e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
html{overflow:hidden;background:#144f25}
body{background:transparent;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;line-height:0}
#hud{position:absolute;left:8px;right:8px;top:8px;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:6px 14px;font-weight:700;font-size:15px;line-height:1.2;color:#fff;background:#000a;border:1px solid #ffffff22;border-radius:999px;box-sizing:border-box}
#mu{background:none;border:0;font-size:20px;color:#fff;padding:0 2px}
#prize{position:fixed;inset:0;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;z-index:9;user-select:text;touch-action:auto}
#prize[hidden]{display:none}
#prize .tr{font-size:72px}
#prize h2,#prize p{margin:0}
#prize input{width:min(90%,320px);padding:12px;font-size:16px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit}
#prize button{padding:12px 20px;font-size:16px;border-radius:8px;border:0;background:#ffe14d;color:#222;font-weight:700}
canvas{display:block;touch-action:none}
#tip{font-size:13px;opacity:.75;padding:6px}
</style>
</head>
<body>
<div id="wrap"><div id="hud"><span id="lv"></span><span id="sh"></span><span id="st"></span><button id="mu">🔊</button></div>
<canvas id="c" width="360" height="560"></canvas></div>
<div id="prize" hidden>
<div class="tr">🏆</div><h2>Campeão!</h2><p>Você zerou as 100 fases!</p>
<p>Digite sua chave PIX para registrar seu prêmio:</p>
<input id="pix" maxlength="77" placeholder="CPF, e-mail, celular ou chave aleatória" autocomplete="off">
<button id="pixok">Registrar</button><p id="pixmsg"></p><button id="pixback">Voltar ao menu</button>
</div>

const c=document.getElementById('c'),W=360,H=560;let x=c.getContext('2d');
const $=id=>document.getElementById(id);
let screen='menu',level=0,unlocked=0,stars=[],shots=3,used=0,mode='aim',path=[],defs=[],gk=null,tms=[],chain=false,drawStart=0,ball,msg='',sub='',won=false,vel,pi,goalW=112,snd=true,ac,ballAngle=0,saveTimer=0;
try{const s=JSON.parse(localStorage.getItem('ct')||'{}');stars=s.stars||[];unlocked=s.unlocked||0;level=Math.max(0,Math.min(99,Number.isInteger(s.currentLevel)?s.currentLevel:0))}catch(e){}
function save(){try{localStorage.setItem('ct',JSON.stringify({stars,unlocked,currentLevel:level}))}catch(e){}}
const total=()=>stars.reduce((a,b)=>a+(b||0),0);
function beep(f,d,t='sine',v=.15,delay=0){
  if(!snd)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+delay;
    o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);
    o.start(s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.stop(s+d)}catch(e){}
}
$('mu').onclick=()=>{snd=!snd;$('mu').textContent=snd?'🔊':'🔇'};
function hud(){$('lv').textContent='Fase '+(level+1);$('sh').textContent='⚽'.repeat(shots)||'—';$('st').textContent='★ '+total()}
function setup(reset){
  if(reset){shots=3;used=0}
  const i=level;goalW=Math.max(64,112-i);
  const n=Math.min(1+Math.floor(i/2),9);defs=[];
  for(let k=0;k<n;k++){
    const sp=i==0?0:Math.min(0.7+0.025*i,3),vert=i>=12&&k%3==2,y=110+k*(320/n);
    defs.push({x:70+((k*97)%220),y,y0:y,vx:vert?0:(k%2?1:-1)*sp,vy:vert?sp:0,r:14,n:k+2});
  }
  gk=null;chain=false;tms=[];const nt=n>=3?Math.min(2+Math.floor(n/2),7):0;for(let k=0;k<nt;k++){const ty=455-k*(340/nt);const bx0=[90,270,180][k%3];tms.push({x:bx0,bx:bx0,ox:0,tx:bx0,tn:performance.now()+1500+Math.random()*2500,y:ty,y0:ty,vy:(k%2?-1:1)*Math.min(0.5+0.012*i,1.5),r:13,n:[10,7,8,11,9,6,5][k],hold:false})}
  ball={x:180,y:510,r:9};ballAngle=0;trail=[];path=[];mode='aim';msg='';sub='';won=false;pi=0;ga=null;pts=[];flash=0;save();hud();buildScene();
}
function next(){
  if(won){if(level==99){screen='trophy';$('prize').hidden=false;return}level++;setup(true)}
  else if(shots<=0){level=0;setup(true)}else setup(false);
}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*CH/r.height-OY}}
c.addEventListener('pointerdown',e=>{
  const p=pos(e);
  if(screen=='menu'){screen='play';setup(true);beep(440,.1);return}
  if(mode=='end'){next();return}
  if(mode=='aim'&&Math.hypot(p.x-ball.x,p.y-ball.y)<50){path=[{x:ball.x,y:ball.y}];mode='draw';drawStart=performance.now();c.setPointerCapture(e.pointerId)}
});
c.addEventListener('pointermove',e=>{
  if(mode!='draw')return;const p=pos(e),l=path[path.length-1];
  if(Math.hypot(p.x-l.x,p.y-l.y)>6&&path.length<160)path.push(p);
});
const drawMs=()=>Math.max(1300,2800-level*20);
function release(){
  if(mode!='draw')return;
  if(path.length>4){
    let L=0;for(let i=1;i<path.length;i++)L+=Math.hypot(path[i].x-path[i-1].x,path[i].y-path[i-1].y);
    ballSpeed=Math.max(3.5,Math.min(10,3+L/Math.max(120,performance.now()-drawStart)*5));
    mode='run';pi=1;vel={x:0,y:0};if(!chain){shots--;used++;chain=true;hud()}beep(200,.1,'square')}
  else{path=[];mode='aim'}
}
c.addEventListener('pointerup',release);
function end(t,g){
  mode='end';msg=t;won=!!g;
  if(g){
    const s=Math.max(1,Math.min(3,4-used));stars[level]=Math.max(stars[level]||0,s);
    unlocked=Math.max(unlocked,Math.min(level+1,99));save();
    sub='★'.repeat(s)+'☆'.repeat(3-s)+(level==99?'  Campeão!':'  Toque para continuar');
  }else{
    sub=shots>0?'Toque para tentar de novo':'Sem chutes! Volta para a Fase 1';
    beep(120,.3,'sawtooth');
  }
  hud();
}
function startGoal(){
  mode='goal';ga={t:0,t0:performance.now(),bx:ball.x,by:36,vx:vel.x*.5,vy:Math.min(vel.y,-2.5)};
  flash=.55;
  for(let i=0;i<46;i++){const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*4;
    pts.push({x:180,y:60,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2.5,l:70+Math.random()*30,c:['#7CFF9B','#ffd54a','#ffffff','#2f8cff','#ff6b6b'][i%5],s:3+Math.random()*3,r:Math.random()*6})}
  [523,659,784,1047].forEach((f,i)=>beep(f,.25,'triangle',.2,i*.12));
}
function goalStep(f){
  ga.t+=f/60;
  ball.x+=ga.vx*f;ball.y+=ga.vy*f;
  ga.vx*=Math.pow(.93,f);ga.vy*=Math.pow(.9,f);ga.vy+=.05*f;
  const a=180-goalW/2+ball.r+3,b=180+goalW/2-ball.r-3;
  if(ball.x<a){ball.x=a;ga.vx=Math.abs(ga.vx)*.4}
  if(ball.x>b){ball.x=b;ga.vx=-Math.abs(ga.vx)*.4}
  if(ball.y<17){ball.y=17;ga.vy=Math.abs(ga.vy)*.3}
  if(ga.t>1.15)end('GOL!',true);
}
function fx(f){
  pts.forEach(p=>{p.x+=p.vx*f;p.y+=p.vy*f;p.vy+=.14*f;p.vx*=Math.pow(.99,f);p.l-=f;p.r+=.2*f});
  pts=pts.filter(p=>p.l>0);if(flash>0)flash=Math.max(0,flash-.03*f);
}
function drawNet(){
  const g0=180-goalW/2,t=ga?(performance.now()-ga.t0)/1000:99,dec=Math.exp(-t*2.4);
  const bx=ga?ga.bx:0,by=ga?ga.by:0,on=ga&&dec>.02;
  const P=(px,py)=>{
    if(!on)return[px,py];
    const dd=Math.hypot(px-bx,py-by),push=Math.exp(-dd*dd/1800),w=Math.sin(t*22-dd*.12);
    return[px+w*1.6*dec,py-(push*7+w*2.2)*dec];
  };
  x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=1;x.beginPath();
  for(let i=g0;i<=g0+goalW+.1;i+=7){for(let j=10,k=0;j<=36;j+=6.5,k++){const q=P(i,j);k?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])}}
  for(let j=10;j<=36;j+=6.5){for(let i=g0,k=0;i<=g0+goalW+.1;i+=7,k++){const q=P(i,j);k?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])}}
  x.stroke();
}
function update(f=1){
  fx(f);
  if(screen=='play'&&performance.now()-saveTimer>1000){saveTimer=performance.now();save();}
  defs.forEach(d=>{d.x+=d.vx*f;if(d.x<20||d.x>340)d.vx*=-1;d.y+=d.vy*f;if(Math.abs(d.y-d.y0)>40)d.vy*=-1});
  tms.forEach(t=>{
    if(t.hold&&mode!='run')return;
    t.y+=t.vy*f;if(Math.abs(t.y-t.y0)>45)t.vy*=-1;
    const now=performance.now();
    if(now>t.tn){let nx;do{nx=50+Math.random()*260}while(Math.abs(nx-t.bx)<80);t.tx=nx;t.tn=now+2500+Math.random()*2500}
    const dx=t.tx-t.bx;t.bx+=Math.sign(dx)*Math.min(Math.abs(dx),.7*f);
    // O companheiro não corre atrás da bola. Ele só a recebe quando a bola
    // realmente cruza o centro dele (a bola pode passar livremente ao lado).
    t.ox*=Math.pow(.92,f);
    t.x=t.bx+t.ox;
  });
  if(gk){gk.x+=gk.vx;if(gk.x<180-goalW/2+gk.r||gk.x>180+goalW/2-gk.r)gk.vx*=-1}
  if(mode=='draw'&&performance.now()-drawStart>drawMs())release();
  if(mode=='goal')goalStep(f);
  if(screen!='play'||mode!='run')return;
  const bs=ballSpeed,n=Math.max(1,Math.ceil(bs*f/4)),ff=f/n;
  for(let q=0;q<n;q++){
    if(pi<path.length){
      const t=path[pi],dx=t.x-ball.x,dy=t.y-ball.y,dist=Math.hypot(dx,dy);
      if(dist<=bs*ff){ball.x=t.x;ball.y=t.y;pi++}else{vel={x:dx/dist*bs,y:dy/dist*bs};ball.x+=vel.x*ff;ball.y+=vel.y*ff}
    }else{
      const fr=Math.pow(0.985,ff);vel.x*=fr;vel.y*=fr;ball.x+=vel.x*ff;ball.y+=vel.y*ff;
      if(Math.hypot(vel.x,vel.y)<0.6)return end('Parou antes!');
    }
    if(q==0){trail.push({x:ball.x,y:ball.y});if(trail.length>10)trail.shift()}
    for(const t of tms){
      const d=Math.hypot(t.x-ball.x,t.y-ball.y);
      if(t.hold){if(d>t.r+ball.r+6)t.hold=false}
      else if(d<t.r+ball.r-1){ball.x=t.x;ball.y=t.y;t.hold=true;vel={x:0,y:0};mode='aim';path=[];ballAngle+=Math.PI*.35;beep(660,.12,'triangle');save();return}
    }
    for(const d of defs)if(Math.hypot(d.x-ball.x,d.y-ball.y)<d.r+ball.r)return end('Bloqueado!');
    // Paredes invisíveis: a bola quica nas laterais e na parte de baixo,
    // mantendo o movimento dentro do campo. No topo, a área do gol continua livre.
    const wallR=ball.r+1;
    if(ball.x<wallR){ball.x=wallR;vel.x=Math.abs(vel.x);ballAngle+=.25}
    else if(ball.x>W-wallR){ball.x=W-wallR;vel.x=-Math.abs(vel.x);ballAngle-=.25}
    if(ball.y>H-wallR){ball.y=H-wallR;vel.y=-Math.abs(vel.y);ballAngle+=.25}
    if(ball.y<36){
      if(Math.abs(ball.x-180)<goalW/2){startGoal();return}
      ball.y=36;vel.y=Math.abs(vel.y);ballAngle+=.35;
    }
    ballAngle+=Math.hypot(vel.x,vel.y)*.035*ff;
  }
}
function sprite(key,w,h,fn){
  const k=key+'|'+K;let sc=SP[k];
  if(!sc){sc=document.createElement('canvas');sc.width=Math.ceil(w*K);sc.height=Math.ceil(h*K);
    const main=x;x=sc.getContext('2d');x.scale(K,K);x.translate(w/2,h/2);fn();x=main;SP[k]=sc}
  return sc;
}
function playerBody(px,py,r,col,label,glow){
  x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(px+2,py+r*.85,r,r*.45,0,0,7);x.fill();
  if(glow){x.shadowColor=col;x.shadowBlur=14}
  x.fillStyle=col;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.shadowBlur=0;
  const g=x.createRadialGradient(px-r*.4,py-r*.45,r*.1,px,py,r*1.05);
  g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.35)');
  x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();
  x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2;x.beginPath();x.arc(px,py,r,0,7);x.stroke();
  x.fillStyle='#fff';x.font='800 11px system-ui';x.textAlign='center';x.fillText(label,px,py+4);
}
function player(px,py,r,col,label,glow){
  const w=r*2+40,sp=sprite('p'+col+label+r+(glow?1:0),w,w,()=>playerBody(0,0,r,col,label,glow));
  x.drawImage(sp,px-w/2,py-w/2,w,w);
}
function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function menuScreen(){
  const t=performance.now()/1000;
  const g=x.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#04120a');g.addColorStop(.5,'#0b3a1e');g.addColorStop(1,'#06202b');
  x.fillStyle=g;x.fillRect(0,0,W,CH);
  const gl=x.createRadialGradient(W/2,OY+170,10,W/2,OY+170,240);gl.addColorStop(0,'rgba(60,255,120,.28)');gl.addColorStop(1,'rgba(60,255,120,0)');
  x.fillStyle=gl;x.fillRect(0,0,W,CH);
  for(let i=0;i<5;i++){x.globalAlpha=.07;x.fillStyle='#fff';x.beginPath();x.arc(40+i*70+Math.sin(t+i*1.7)*14,(t*30+i*140)%CH,10+i*2,0,7);x.fill()}
  x.globalAlpha=1;
  x.save();x.translate(0,OY);
  const ls=236,ly=40+Math.sin(t*1.6)*4;
  x.save();rr(W/2-ls/2,ly,ls,ls,46);x.clip();
  if(LOGO.complete&&LOGO.naturalWidth)x.drawImage(LOGO,W/2-ls/2,ly,ls,ls);
  x.restore();
  x.strokeStyle='rgba(124,255,155,.75)';x.lineWidth=3;rr(W/2-ls/2,ly,ls,ls,46);x.stroke();
  x.textAlign='center';
  const s=1+Math.sin(t*4)*.03;
  x.save();x.translate(W/2,372);x.scale(s,s);x.translate(-W/2,-372);
  const bg=x.createLinearGradient(0,340,0,404);bg.addColorStop(0,'#ffe96b');bg.addColorStop(1,'#ffb300');
  x.fillStyle='rgba(255,213,74,.22)';rr(52,332,256,80,40);x.fill();x.fillStyle=bg;rr(60,340,240,64,32);x.fill();
  x.fillStyle='#2a1f00';x.font='900 26px system-ui';x.fillText('JOGAR',W/2,381);x.restore();
  x.fillStyle='rgba(255,255,255,.1)';rr(40,436,130,52,14);x.fill();rr(190,436,130,52,14);x.fill();
  x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=1;rr(40,436,130,52,14);x.stroke();rr(190,436,130,52,14);x.stroke();
  x.fillStyle='#ffd54a';x.font='bold 18px system-ui';x.fillText('★ '+total(),105,468);
  x.fillStyle='#fff';x.font='bold 15px system-ui';x.fillText('Recorde: Fase '+(Math.min(unlocked,99)+1),255,467);
  x.fillStyle='rgba(255,255,255,.6)';x.font='14px system-ui';x.fillText(level>0?'Continuar na Fase '+(level+1):'Faça o gol em 100 fases',W/2,528);
  x.restore();
}
let CH=648,OY=44,K=1,trail=[],ballSpeed=6,ga=null,pts=[],flash=0,bgc,scc,hv='';const SP={};
function buildBg(){
  bgc=document.createElement('canvas');bgc.width=Math.round(W*K);bgc.height=Math.round(CH*K);const b=bgc.getContext('2d');b.scale(K,K);
  for(let i=-4;i<CH/40+4;i++){b.fillStyle=((i%2)+2)%2?'#1e7a39':'#238a41';b.fillRect(0,OY+i*40,W,40)}
  const vg=b.createRadialGradient(W/2,CH/2,CH*.22,W/2,CH/2,CH*.78);vg.addColorStop(0,'rgba(255,255,255,.05)');vg.addColorStop(1,'rgba(0,0,0,.38)');
  b.fillStyle=vg;b.fillRect(0,0,W,CH);
}
function buildScene(){
  scc=document.createElement('canvas');scc.width=Math.round(W*K);scc.height=Math.round(CH*K);
  const main=x;x=scc.getContext('2d');x.scale(K,K);
  x.drawImage(bgc,0,0,W,CH);x.save();x.translate(0,OY);
  x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=2;x.lineJoin='round';
  rr(10,10,W-20,H-20,10);x.stroke();rr(100,10,160,60,4);x.stroke();rr(100,H-70,160,60,4);x.stroke();
  x.beginPath();x.arc(W/2,H/2,50,0,7);x.moveTo(10,H/2);x.lineTo(W-10,H/2);x.stroke();
  const g0=180-goalW/2;
  x.fillStyle='rgba(0,0,0,.35)';x.fillRect(g0,10,goalW,26);
  x.shadowColor='#fff';x.shadowBlur=10;x.fillStyle='#fff';x.fillRect(g0-3,8,4,30);x.fillRect(g0+goalW-1,8,4,30);x.fillRect(g0-3,8,goalW+6,3);x.shadowBlur=0;
  x.fillStyle='rgba(255,255,255,.9)';x.fillRect(g0,34,goalW,3);
  x.restore();x=main;
}
function layout(){
  const iw=document.body.clientWidth||innerWidth,ih=document.body.clientHeight||innerHeight;
  CH=Math.min(900,Math.max(648,Math.round(W*ih/iw)));
  OY=Math.round((CH-H)/2);
  const sc=Math.min(iw/W,ih/CH);K=sc*Math.min(window.devicePixelRatio||1,2.5);c.width=Math.round(W*K);c.height=Math.round(CH*K);
  c.style.width=Math.floor(W*sc)+'px';c.style.height=Math.floor(CH*sc)+'px';
  buildBg();buildScene();
}
addEventListener('resize',layout);
function ballBody(bx,by,r){
  x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(bx+2,by+r*.85,r*.95,r*.45,0,0,7);x.fill();
  const g=x.createRadialGradient(bx-r*.35,by-r*.35,r*.15,bx,by,r);g.addColorStop(0,'#fff');g.addColorStop(1,'#cfd6d2');
  x.fillStyle=g;x.beginPath();x.arc(bx,by,r,0,7);x.fill();
  x.save();x.beginPath();x.arc(bx,by,r,0,7);x.clip();x.fillStyle='#1b1f1d';
  x.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;x.lineTo(bx+Math.cos(a)*r*.42,by+Math.sin(a)*r*.42)}x.fill();
  for(let i=0;i<5;i++){const a=-Math.PI/2+Math.PI/5+i*Math.PI*2/5;x.beginPath();x.arc(bx+Math.cos(a)*r,by+Math.sin(a)*r,r*.34,0,7);x.fill()}
  x.restore();
  x.strokeStyle='#1b1f1d';x.lineWidth=1.2;x.beginPath();x.arc(bx,by,r,0,7);x.stroke();
}
function drawBall(bx,by,r){
  const w=r*2+16,sp=sprite('b'+r,w,w,()=>ballBody(0,0,r));
  x.save();x.translate(bx,by);x.rotate(ballAngle);x.drawImage(sp,-w/2,-w/2,w,w);x.restore();
}
function draw(){
  x.setTransform(K,0,0,K,0,0);x.imageSmoothingQuality='high';
  if(screen=='menu'){if(hv!='hidden'){hv='hidden';$('hud').style.visibility='hidden'}menuScreen();return}
  const v=screen=='play'?'visible':'hidden';if(hv!=v){hv=v;$('hud').style.visibility=v}
  x.drawImage(scc,0,0,W,CH);x.save();x.translate(0,OY);
  drawNet();
  defs.forEach(d=>player(d.x,d.y,d.r,'#e53945',d.n));
  tms.forEach(t=>{if(t.hold){x.strokeStyle='#ffe14d';x.lineWidth=3;x.beginPath();x.arc(t.x,t.y,t.r+5,0,7);x.stroke()}player(t.x,t.y,t.r,'#2f8cff',t.n,true)});
  player(155,H-32,14,'#2f8cff','9');
  trail.forEach((q,i)=>{x.globalAlpha=(i+1)/trail.length*.35;x.fillStyle='#fff';x.beginPath();x.arc(q.x,q.y,ball.r*(i+1)/trail.length,0,7);x.fill()});
  x.globalAlpha=1;
  if(path.length>1){
    x.lineCap='round';x.lineJoin='round';
    x.beginPath();x.moveTo(path[0].x,path[0].y);path.forEach(q=>x.lineTo(q.x,q.y));
    x.strokeStyle='rgba(198,255,61,.28)';x.lineWidth=10;x.stroke();
    x.strokeStyle='#c6ff3d';x.lineWidth=4;x.stroke();
  }
  if(ga){const sc=1-.18*Math.min(1,(performance.now()-ga.t0)/500);x.save();x.translate(ball.x,ball.y);x.scale(sc,sc);x.translate(-ball.x,-ball.y);drawBall(ball.x,ball.y,ball.r);x.restore()}
  else drawBall(ball.x,ball.y,ball.r);
  if(mode=='draw'){
    const f=Math.max(0,1-(performance.now()-drawStart)/drawMs());
    x.fillStyle='rgba(0,0,0,.4)';rr(20,H-24,W-40,9,4.5);x.fill();
    if(f>0.02){x.fillStyle=f>.35?'#c6ff3d':'#ff6b6b';rr(20,H-24,(W-40)*f,9,4.5);x.fill()}
  }
  x.textAlign='center';
  if(mode=='end'){
    x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,-OY,W,CH);
    const col=won?'#7CFF9B':'#ff6b6b';
    const cg=x.createLinearGradient(0,190,0,360);cg.addColorStop(0,'#16241b');cg.addColorStop(1,'#0b130e');
    x.fillStyle=cg;rr(35,190,290,170,26);x.fill();
    x.strokeStyle=col;x.lineWidth=2;x.stroke();
    x.fillStyle=col;x.font='900 34px system-ui';x.fillText(msg,W/2,242);
    const parts=sub.split('  ');
    if(won){x.fillStyle='#ffd54a';x.font='38px system-ui';x.fillText(parts[0],W/2,298);x.fillStyle='#fff';x.font='15px system-ui';x.fillText(parts[1]||'',W/2,336)}
    else{x.fillStyle='#fff';x.font='16px system-ui';x.fillText(sub,W/2,300);x.fillStyle='rgba(255,255,255,.55)';x.font='13px system-ui';x.fillText('Toque na tela',W/2,332)}
  }
  if(flash>0){x.fillStyle='rgba(255,255,255,'+flash+')';x.fillRect(0,-OY,W,CH)}
  pts.forEach(p=>{x.globalAlpha=Math.min(1,p.l/30);x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
  x.globalAlpha=1;
  x.restore();
}
$('pixok').onclick=()=>{
  const v=$('pix').value.trim();
  if(v.length<5){$('pixmsg').textContent='Digite uma chave válida.';return}
  try{localStorage.setItem('ctpix',v)}catch(e){}
  $('pixmsg').textContent='Chave registrada neste aparelho ✔ (protótipo: ainda não é enviada a ninguém)';
};
$('pixback').onclick=()=>{$('prize').hidden=true;screen='menu';level=0;$('pixmsg').textContent=''};
layout();hud();setup(true);
let last=0;(function loop(ts){const f=last?Math.min(2.5,Math.max(.2,(ts-last)/16.667)):1;last=ts;update(f);draw();requestAnimationFrame(loop)})(performance.now());
