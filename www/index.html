<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Craque do Traço</title>
<style>
:root{--bg:#f2f5f0;--fg:#1b2a1b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a10;--fg:#e8f2e6}}
:root[data-theme="dark"]{--bg:#0f1a10;--fg:#e8f2e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none}
#hud{width:min(100%,360px);display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-weight:600;box-sizing:border-box}
#mu{background:none;border:0;font-size:20px;color:inherit;padding:0 4px}
#prize{position:fixed;inset:0;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;z-index:9;user-select:text;touch-action:auto}
#prize[hidden]{display:none}
#prize .tr{font-size:72px}
#prize h2,#prize p{margin:0}
#prize input{width:min(90%,320px);padding:12px;font-size:16px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit}
#prize button{padding:12px 20px;font-size:16px;border-radius:8px;border:0;background:#ffe14d;color:#222;font-weight:700}
canvas{max-width:100%;max-height:calc(100% - 70px);aspect-ratio:360/560;border-radius:10px;touch-action:none}
#tip{font-size:13px;opacity:.75;padding:6px}
</style>
</head>
<body>
<div id="hud"><span id="lv"></span><span id="sh"></span><span id="st"></span><button id="mu">🔊</button></div>
<canvas id="c" width="360" height="560"></canvas>
<div id="prize" hidden>
<div class="tr">🏆</div><h2>Campeão!</h2><p>Você zerou as 100 fases!</p>
<p>Digite sua chave PIX para registrar seu prêmio:</p>
<input id="pix" maxlength="77" placeholder="CPF, e-mail, celular ou chave aleatória" autocomplete="off">
<button id="pixok">Registrar</button><p id="pixmsg"></p><button id="pixback">Voltar ao menu</button>
</div>
<div id="tip">Desenhe rápido: o tempo é curto! Passe para os companheiros azuis</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=360,H=560;
const $=id=>document.getElementById(id);
let screen='menu',level=0,unlocked=0,stars=[],shots=3,used=0,mode='aim',path=[],defs=[],gk=null,tms=[],chain=false,drawStart=0,ball,msg='',sub='',won=false,vel,pi,goalW=112,snd=true,ac;
try{const s=JSON.parse(localStorage.getItem('ct')||'{}');stars=s.stars||[];unlocked=s.unlocked||0}catch(e){}
function save(){try{localStorage.setItem('ct',JSON.stringify({stars,unlocked}))}catch(e){}}
const total=()=>stars.reduce((a,b)=>a+(b||0),0);
function beep(f,d,t='sine',v=.15,delay=0){
  if(!snd)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+delay;
    o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);
    o.start(s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.stop(s+d)}catch(e){}
}
$('mu').onclick=()=>{snd=!snd;$('mu').textContent=snd?'🔊':'🔇'};
function hud(){$('lv').textContent='Fase '+(level+1);$('sh').textContent='⚽'.repeat(shots)||'—';$('st').textContent='★ '+total()}
function setup(reset){
  if(reset){shots=3;used=0}
  const i=level;goalW=Math.max(64,112-Math.floor(i/2));
  const n=Math.min(1+Math.floor(i/5),9);defs=[];
  for(let k=0;k<n;k++){
    const sp=i==0?0:Math.min(0.6+0.022*i,2.6),vert=i>=30&&k%3==2,y=110+k*(320/n);
    defs.push({x:70+((k*97)%220),y,y0:y,vx:vert?0:(k%2?1:-1)*sp,vy:vert?sp:0,r:14,n:k+2});
  }
  gk=null;chain=false;tms=[];const nt=n>=3?Math.min(2+Math.floor(n/3),6):0;for(let k=0;k<nt;k++)tms.push({x:[90,270,180][k%3],y:455-k*(340/nt),r:13,n:[10,7,8,11,9,6][k],hold:false});
  ball={x:180,y:510,r:9};path=[];mode='aim';msg='';sub='';won=false;pi=0;hud();
}
function next(){
  if(won){if(level==99){screen='trophy';$('prize').hidden=false;return}level++;setup(true)}
  else setup(shots<=0);
}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.addEventListener('pointerdown',e=>{
  const p=pos(e);
  if(screen=='menu'){screen='play';level=Math.min(unlocked,99);setup(true);beep(440,.1);return}
  if(mode=='end'){next();return}
  if(mode=='aim'&&Math.hypot(p.x-ball.x,p.y-ball.y)<50){path=[{x:ball.x,y:ball.y}];mode='draw';drawStart=performance.now();c.setPointerCapture(e.pointerId)}
});
c.addEventListener('pointermove',e=>{
  if(mode!='draw')return;const p=pos(e),l=path[path.length-1];
  if(Math.hypot(p.x-l.x,p.y-l.y)>6&&path.length<160)path.push(p);
});
const drawMs=()=>Math.max(1300,2800-level*15);
function release(){
  if(mode!='draw')return;
  if(path.length>4){mode='run';pi=1;vel={x:0,y:0};if(!chain){shots--;used++;chain=true;hud()}beep(200,.1,'square')}
  else{path=[];mode='aim'}
}
c.addEventListener('pointerup',release);
function end(t,g){
  mode='end';msg=t;won=!!g;
  if(g){
    const s=4-used;stars[level]=Math.max(stars[level]||0,s);
    unlocked=Math.max(unlocked,Math.min(level+1,99));save();
    sub='★'.repeat(s)+'☆'.repeat(3-s)+(level==99?'  Campeão!':'  Toque para continuar');
    [523,659,784,1047].forEach((f,i)=>beep(f,.25,'triangle',.2,i*.12));
  }else{
    sub=shots>0?'Toque para tentar de novo':'Sem chutes! A fase recomeça';
    beep(120,.3,'sawtooth');
  }
  hud();
}
function update(){
  defs.forEach(d=>{d.x+=d.vx;if(d.x<20||d.x>340)d.vx*=-1;d.y+=d.vy;if(Math.abs(d.y-d.y0)>40)d.vy*=-1});
  if(gk){gk.x+=gk.vx;if(gk.x<180-goalW/2+gk.r||gk.x>180+goalW/2-gk.r)gk.vx*=-1}
  if(mode=='draw'&&performance.now()-drawStart>drawMs())release();
  if(screen!='play'||mode!='run')return;
  if(pi<path.length){
    const t=path[pi],dx=t.x-ball.x,dy=t.y-ball.y,dist=Math.hypot(dx,dy);
    if(dist<6)pi++;else{vel={x:dx/dist*6,y:dy/dist*6};ball.x+=vel.x;ball.y+=vel.y}
  }else{
    vel.x*=0.985;vel.y*=0.985;ball.x+=vel.x;ball.y+=vel.y;
    if(Math.hypot(vel.x,vel.y)<0.6)return end('Parou antes!');
  }
  for(const t of tms){
    const d=Math.hypot(t.x-ball.x,t.y-ball.y);
    if(t.hold){if(d>t.r+ball.r+4)t.hold=false}
    else if(d<t.r+ball.r){ball.x=t.x;ball.y=t.y;t.hold=true;mode='aim';path=[];beep(660,.12,'triangle');return}
  }
  for(const d of defs)if(Math.hypot(d.x-ball.x,d.y-ball.y)<d.r+ball.r)return end('Bloqueado!');
  if(gk&&Math.hypot(gk.x-ball.x,gk.y-ball.y)<gk.r+ball.r)return end('Defendeu!');
  if(ball.y<36){Math.abs(ball.x-180)<goalW/2?end('GOL!',true):end('Pra fora!')}
  else if(ball.x<0||ball.x>W||ball.y>H)end('Saiu!');
}
function player(px,py,r,col,label){
  x.fillStyle='#0004';x.beginPath();x.ellipse(px+2,py+r*.8,r,r*.5,0,0,7);x.fill();
  x.fillStyle=col;x.beginPath();x.arc(px,py,r,0,7);x.fill();
  x.strokeStyle='#fff';x.lineWidth=2;x.stroke();
  x.fillStyle='#fff';x.font='bold 11px system-ui';x.textAlign='center';x.fillText(label,px,py+4);
}
function draw(){
  for(let i=0;i<14;i++){x.fillStyle=i%2?'#2e8b3d':'#36a047';x.fillRect(0,i*40,W,40)}
  x.strokeStyle='#ffffffaa';x.lineWidth=2;x.strokeRect(8,8,W-16,H-16);
  x.beginPath();x.arc(180,H/2,50,0,7);x.stroke();x.strokeRect(100,8,160,60);
  const g0=180-goalW/2;
  x.fillStyle='#ffffff33';x.fillRect(g0,8,goalW,28);
  x.strokeStyle='#ffffff55';x.lineWidth=1;
  for(let i=g0;i<=g0+goalW;i+=8){x.beginPath();x.moveTo(i,8);x.lineTo(i,36);x.stroke()}
  x.fillStyle='#fff';x.fillRect(g0,34,goalW,4);x.fillRect(g0-3,8,4,30);x.fillRect(g0+goalW-1,8,4,30);
  defs.forEach(d=>player(d.x,d.y,d.r,'#d33',d.n));
  tms.forEach(t=>{if(t.hold){x.strokeStyle='#ffe14d';x.lineWidth=3;x.beginPath();x.arc(t.x,t.y,t.r+5,0,7);x.stroke()}player(t.x,t.y,t.r,'#1e6fe0',t.n)});
  if(gk)player(gk.x,gk.y,gk.r,'#e6b800','1');
  player(155,528,14,'#1e6fe0','9');
  if(path.length>1){x.strokeStyle='#ffe14d';x.lineWidth=3;x.setLineDash([6,6]);x.beginPath();x.moveTo(path[0].x,path[0].y);path.forEach(p=>x.lineTo(p.x,p.y));x.stroke();x.setLineDash([])}
  x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();
  x.strokeStyle='#222';x.lineWidth=2;x.stroke();
  x.fillStyle='#222';x.beginPath();x.arc(ball.x,ball.y,3.5,0,7);x.fill();
  if(mode=='draw'){const f=Math.max(0,1-(performance.now()-drawStart)/drawMs());x.fillStyle='#ffe14d';x.fillRect(20,H-16,(W-40)*f,6)}
  x.textAlign='center';
  if(mode=='end'){
    x.fillStyle='#000b';x.fillRect(0,220,W,120);
    x.fillStyle='#fff';x.font='bold 26px system-ui';x.fillText(msg,W/2,270);
    x.font='16px system-ui';x.fillText(sub,W/2,305);
  }
  if(screen=='menu'){
    x.fillStyle='#000c';x.fillRect(0,0,W,H);
    x.fillStyle='#fff';x.font='bold 34px system-ui';x.fillText('⚽ Craque do Traço',W/2,200);
    x.font='16px system-ui';x.fillText('Desenhe o caminho e faça o gol',W/2,235);
    x.fillText('★ '+total()+'  ·  Fase '+(Math.min(unlocked,99)+1),W/2,300);
    x.fillStyle='#ffe14d';x.font='bold 22px system-ui';x.fillText('Toque para jogar',W/2,380);
  }
}
$('pixok').onclick=()=>{
  const v=$('pix').value.trim();
  if(v.length<5){$('pixmsg').textContent='Digite uma chave válida.';return}
  try{localStorage.setItem('ctpix',v)}catch(e){}
  $('pixmsg').textContent='Chave registrada neste aparelho ✔ (protótipo: ainda não é enviada a ninguém)';
};
$('pixback').onclick=()=>{$('prize').hidden=true;screen='menu';level=0;$('pixmsg').textContent=''};
hud();setup(true);
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
